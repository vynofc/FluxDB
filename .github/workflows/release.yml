name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: dotnet restore WPF/FluxDB/FluxDB.csproj

      - name: Build
        run: |
          if (-not (Test-Path bin)) { New-Item -ItemType Directory -Path bin -Force | Out-Null }
          msbuild WPF/FluxDB/FluxDB.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:OutDir="${{ github.workspace }}\bin\"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Installer
        run: |
          cd Installer
          go build -ldflags="-s -w" -o FluxDB-Installer.exe .

      - name: Build Log Viewer
        run: |
          if (-not (Test-Path bin/components)) { New-Item -ItemType Directory -Path bin/components -Force | Out-Null }
          cd "Log_Viewer"
          go build -ldflags="-s -w" -o ../bin/components/Log_Viewer.exe .

      - name: Create zip
        run: |
          Compress-Archive -Path bin\* -DestinationPath FluxDB.zip -Force

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: FluxDB.zip
          asset_name: FluxDB.zip
          asset_content_type: application/zip

      - name: Upload installer asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: Installer/FluxDB-Installer.exe
          asset_name: FluxDB-Installer.exe
          asset_content_type: application/vnd.microsoft.portable-executable