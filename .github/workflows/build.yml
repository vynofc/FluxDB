name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore FluxDB.sln

      - name: Build
        run: msbuild FluxDB.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Log Viewer
        run: |
          cd "Log_Viewer"
          go build -ldflags="-s -w" -o ..\bin\Release\components\Log_Viewer.exe .