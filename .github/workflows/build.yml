name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore FluxDB.sln

      - name: Build
        run: |
          if (-not (Test-Path bin)) { New-Item -ItemType Directory -Path bin -Force | Out-Null }
          msbuild WPF/FluxDB/FluxDB.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:OutDir=bin\

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Installer
        run: |
          cd Installer
          go build -ldflags="-s -w" -o ../bin/FluxDB-Installer.exe .

      - name: Build Log Viewer
        run: |
          if (-not (Test-Path bin/components)) { New-Item -ItemType Directory -Path bin/components -Force | Out-Null }
          cd "Log_Viewer"
          go build -ldflags="-s -w" -o ../bin/components/Log_Viewer.exe .