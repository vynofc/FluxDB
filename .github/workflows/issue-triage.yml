name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Auto-assign to vynOFC
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['vynOFC']
            });

      - name: Classify with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = (issue.body || '').substring(0, 2000);
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.log('Missing GEMINI_API_KEY secret, skipping Gemini classification');
              return;
            }

            const prompt = [
              'Du bist ein Issue-Triage-Bot für das Projekt FluxDB (eine Windows-WPF-App mit Go-Installer und Go-Log-Viewer).',
              '',
              'Analysiere folgenden Issue-Titel und -Body und entscheide:',
              '1. Komponente: "FluxDB" (WPF-App, UI, Suche, Tags, Einstellungen) oder "Installer" (Go-Installer, Setup, Download, Log-Viewer)',
              '2. Typ: "bug" (Fehler, Problem, Crash) oder "enhancement" (Feature-Wunsch, Verbesserung, Idee)',
              '',
              'Antworte NUR mit einem JSON-Objekt in diesem Format, kein weiterer Text:',
              '{"component": "FluxDB|Installer", "type": "bug|enhancement"}',
              '',
              `Titel: ${title}`,
              `Body: ${body}`
            ].join('\n');

            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-goog-api-key': apiKey
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            console.log('Gemini HTTP status:', response.status);
            const rawBody = await response.text();
            console.log('Gemini raw response:', rawBody.substring(0, 500));

            let data;
            try {
              data = JSON.parse(rawBody);
            } catch (e) {
              console.log('Failed to parse Gemini response as JSON:', e.message);
              return;
            }

            if (data.error) {
              console.log('Gemini API error:', data.error.message);
              return;
            }
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            console.log('Gemini text:', text);

            // Parse JSON from response (handle markdown code fences)
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
              console.log('No JSON found in Gemini response, skipping labels');
              return;
            }

            let classification;
            try {
              classification = JSON.parse(jsonMatch[0]);
            } catch (e) {
              console.log('Failed to parse Gemini response:', e.message);
              return;
            }

            const labels = [];
            if (classification.component === 'FluxDB' || classification.component === 'Installer') {
              labels.push(classification.component);
            }
            if (classification.type === 'bug' || classification.type === 'enhancement') {
              labels.push(classification.type);
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
              console.log(`Labels applied: ${labels.join(', ')}`);
            }