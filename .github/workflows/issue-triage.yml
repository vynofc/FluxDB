name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Classify with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = (issue.body || '').substring(0, 2000);
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.log('Missing GEMINI_API_KEY secret, skipping Gemini classification');
              return;
            }

            const prompt = [
              'Du bist ein Issue-Triage-Bot für das Projekt FluxDB (eine Windows-WPF-App mit Go-Installer und Go-Log-Viewer).',
              '',
              'Analysiere folgenden Issue-Titel und -Body und entscheide:',
              '1. Komponente: "FluxDB" (WPF-App, UI, Suche, Tags, Einstellungen) oder "Installer" (Go-Installer, Setup, Download, Log-Viewer)',
              '2. Typ: "bug" (Fehler, Problem, Crash) oder "enhancement" (Feature-Wunsch, Verbesserung, Idee)',
              '',
              'Antworte NUR mit einem JSON-Objekt in diesem Format, kein weiterer Text:',
              '{"component": "FluxDB|Installer", "type": "bug|enhancement"}',
              '',
              `Titel: ${title}`,
              `Body: ${body}`
            ].join('\n');

            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-goog-api-key': apiKey
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            console.log('Gemini HTTP status:', response.status);
            const rawBody = await response.text();
            console.log('Gemini raw response:', rawBody.substring(0, 500));

            let data;
            try {
              data = JSON.parse(rawBody);
            } catch (e) {
              console.log('Failed to parse Gemini response as JSON:', e.message);
              return;
            }

            if (data.error) {
              console.log('Gemini API error:', data.error.message);
              return;
            }
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            console.log('Gemini text:', text);

            // Parse JSON from response (handle markdown code fences)
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
              console.log('No JSON found in Gemini response, skipping labels');
              return;
            }

            let classification;
            try {
              classification = JSON.parse(jsonMatch[0]);
            } catch (e) {
              console.log('Failed to parse Gemini response:', e.message);
              return;
            }

            const labels = [];
            if (classification.component === 'FluxDB' || classification.component === 'Installer') {
              labels.push(classification.component);
            }
            if (classification.type === 'bug' || classification.type === 'enhancement') {
              labels.push(classification.type);
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
              console.log(`Labels applied: ${labels.join(', ')}`);
            }

      - name: Auto-assign to vynOFC
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['vynOFC']
            });

      - name: Detect blocker relationship with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.log('Missing GEMINI_API_KEY secret, skipping blocker detection');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentNumber = issue.number;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const candidates = openIssues
              .filter(i => !i.pull_request && i.number !== currentNumber)
              .slice(0, 60)
              .map(i => ({
                number: i.number,
                title: i.title || '',
                body: (i.body || '').substring(0, 500)
              }));

            if (candidates.length === 0) {
              console.log('No other open issues found, skipping blocker detection');
              return;
            }

            const prompt = [
              'Du analysierst Beziehungen zwischen GitHub Issues.',
              'Pruefe, ob das neue Issue direkt von genau einem anderen offenen Issue blockiert wird.',
              'Wenn kein klarer Blocker existiert, antworte mit blockedBy = null.',
              'Antworte NUR mit JSON in diesem Format:',
              '{"blockedBy": number|null, "reason": "kurze Begruendung"}',
              '',
              `Aktuelles Issue #${currentNumber}:`,
              `Titel: ${issue.title || ''}`,
              `Body: ${(issue.body || '').substring(0, 2000)}`,
              '',
              'Offene moegliche Blocker-Issues:',
              JSON.stringify(candidates)
            ].join('\n');

            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-goog-api-key': apiKey
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const rawBody = await response.text();
            console.log('Gemini blocker HTTP status:', response.status);
            console.log('Gemini blocker raw response:', rawBody.substring(0, 500));

            let data;
            try {
              data = JSON.parse(rawBody);
            } catch (e) {
              console.log('Failed to parse Gemini blocker response as JSON:', e.message);
              return;
            }

            if (data.error) {
              console.log('Gemini blocker API error:', data.error.message);
              return;
            }

            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
              console.log('No JSON found in Gemini blocker response');
              return;
            }

            let relationship;
            try {
              relationship = JSON.parse(jsonMatch[0]);
            } catch (e) {
              console.log('Failed to parse Gemini blocker JSON payload:', e.message);
              return;
            }

            const blockedBy = Number.isInteger(relationship?.blockedBy)
              ? relationship.blockedBy
              : null;

            const candidateNumbers = new Set(candidates.map(c => c.number));
            if (!blockedBy || !candidateNumbers.has(blockedBy)) {
              console.log('No valid blocking relationship detected');
              return;
            }

            const reason = (relationship?.reason || 'von Gemini erkannt').toString().substring(0, 300);
            const blockedComment = `Blocked by #${blockedBy}. Grund: ${reason}`;
            const blockingComment = `Blocks #${currentNumber}. Grund: ${reason}`;
            const blockedBodyLine = `Blocked by #${blockedBy}`;
            const blockingBodyLine = `Blocks #${currentNumber}`;

            const currentIssueData = await github.rest.issues.get({
              owner,
              repo,
              issue_number: currentNumber
            });
            const currentIssueBody = currentIssueData.data.body || '';
            if (!currentIssueBody.includes(blockedBodyLine)) {
              const nextBody = currentIssueBody.trim().length > 0
                ? `${currentIssueBody}\n\n${blockedBodyLine}`
                : blockedBodyLine;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: currentNumber,
                body: nextBody
              });
            }

            const blockerIssueData = await github.rest.issues.get({
              owner,
              repo,
              issue_number: blockedBy
            });
            const blockerIssueBody = blockerIssueData.data.body || '';
            if (!blockerIssueBody.includes(blockingBodyLine)) {
              const nextBody = blockerIssueBody.trim().length > 0
                ? `${blockerIssueBody}\n\n${blockingBodyLine}`
                : blockingBodyLine;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: blockedBy,
                body: nextBody
              });
            }

            const currentComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: currentNumber,
              per_page: 100
            });

            if (!currentComments.some(c => (c.body || '').includes(`Blocked by #${blockedBy}`))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: currentNumber,
                body: blockedComment
              });
            }

            const blockerComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: blockedBy,
              per_page: 100
            });

            if (!blockerComments.some(c => (c.body || '').includes(`Blocks #${currentNumber}`))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: blockedBy,
                body: blockingComment
              });
            }

            console.log(`Relationship created: #${currentNumber} blocked by #${blockedBy}`);

      - name: Create issue branch
        id: create_branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;

            const slug = (issue.title || 'issue')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 40) || 'issue';

            const branchName = `issue/${issue.number}-${slug}`;
            core.setOutput('branch_name', branchName);

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseRef.data.object.sha
              });
              console.log(`Created branch: ${branchName}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Branch already exists: ${branchName}`);
              } else {
                throw e;
              }
            }

      - name: Assign issue to Copilot
        uses: actions/github-script@v7
        env:
          CREATED_BRANCH: ${{ steps.create_branch.outputs.branch_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;

            const candidates = [
              'github-copilot[bot]',
              'copilot'
            ].filter(Boolean);

            let assigned = false;
            let selectedAssignee = null;

            for (const assignee of candidates) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [assignee]
                });
                assigned = true;
                selectedAssignee = assignee;
                break;
              } catch (e) {
                console.log(`Copilot assign attempt failed for ${assignee}: ${e.message}`);
              }
            }

            if (assigned) {
              console.log(`Copilot assigned: ${selectedAssignee}`);
            } else {
              console.log('Copilot could not be assigned');
            }
