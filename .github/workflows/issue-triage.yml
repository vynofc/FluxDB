name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Classify by keywords and template fields
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const combined = `${title} ${body}`;
            const existingLabels = (issue.labels || []).map(l => l.name);

            // --- Component ---
            // 1. Parse template dropdown: "### Komponente\n\nFluxDB (WPF-App)" or "Installer"
            const componentMatch = (issue.body || '').match(/###\s*Komponente\s*\n+([^\n]+)/i);
            let componentLabel = null;
            if (componentMatch) {
              const val = componentMatch[1].trim();
              if (val.startsWith('Installer')) componentLabel = 'Installer';
              else if (val.startsWith('FluxDB')) componentLabel = 'FluxDB';
            }

            // 2. Keyword fallback
            if (!componentLabel) {
              const installerKeywords = ['installer', 'install', 'setup', 'download', 'log viewer', 'log-viewer', 'tui'];
              const fluxdbKeywords    = ['wpf', 'ui', 'search', 'suche', 'tag', 'settings', 'einstellung', 'vorschau', 'hauptfenster', 'dark theme', 'fenster'];
              const isInstaller = installerKeywords.some(k => combined.includes(k));
              const isFluxDB    = fluxdbKeywords.some(k => combined.includes(k));
              if (isInstaller && !isFluxDB) componentLabel = 'Installer';
              else componentLabel = 'FluxDB';
            }

            // --- Type ---
            // 1. Already set by issue template (labels: frontmatter)
            let typeLabel = null;
            if (existingLabels.includes('bug')) typeLabel = 'bug';
            else if (existingLabels.includes('enhancement')) typeLabel = 'enhancement';

            // 2. Keyword fallback
            if (!typeLabel) {
              const bugKeywords         = ['bug', 'fehler', 'error', 'crash', 'absturz', 'kaputt', 'broken', 'fix', 'funktioniert nicht', 'problem'];
              const enhancementKeywords = ['feature', 'enhancement', 'verbesserung', 'idee', 'wunsch', 'request', 'hinzufügen', 'add ', 'neu ', 'new '];
              const isBug         = bugKeywords.some(k => combined.includes(k));
              const isEnhancement = enhancementKeywords.some(k => combined.includes(k));
              if (isBug && !isEnhancement) typeLabel = 'bug';
              else if (isEnhancement) typeLabel = 'enhancement';
            }

            // Apply missing labels
            const labelsToAdd = [];
            if (componentLabel && !existingLabels.includes(componentLabel)) labelsToAdd.push(componentLabel);
            if (typeLabel && !existingLabels.includes(typeLabel)) labelsToAdd.push(typeLabel);

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
              console.log(`Labels applied: ${labelsToAdd.join(', ')}`);
            } else {
              console.log('No new labels needed');
            }

      - name: Auto-assign to vynOFC
        uses: actions/github-script@v7
        with:
          script: |
            const existing = (context.payload.issue.assignees || []).map(a => a.login);
            if (!existing.includes('vynOFC')) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['vynOFC']
              });
            }

      - name: Detect blocker relationship from body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentNumber = issue.number;

            // Match "blocked by #123" or "blockiert von #123"
            const blockerMatch = body.match(/blocked\s+by\s+#(\d+)|blockiert\s+von\s+#(\d+)/i);
            if (!blockerMatch) {
              console.log('No blocker reference found in body');
              return;
            }
            const blockedBy = parseInt(blockerMatch[1] || blockerMatch[2], 10);

            // Verify the referenced issue exists and is open
            let blockerIssue;
            try {
              const resp = await github.rest.issues.get({ owner, repo, issue_number: blockedBy });
              blockerIssue = resp.data;
            } catch (e) {
              console.log(`Issue #${blockedBy} not found: ${e.message}`);
              return;
            }
            if (blockerIssue.state !== 'open') {
              console.log(`Issue #${blockedBy} is not open, skipping`);
              return;
            }

            const reason = 'im Issue-Body referenziert';
            const blockedComment  = `Blocked by #${blockedBy}. Grund: ${reason}`;
            const blockingComment = `Blocks #${currentNumber}. Grund: ${reason}`;
            const blockedBodyLine  = `Blocked by #${blockedBy}`;
            const blockingBodyLine = `Blocks #${currentNumber}`;

            // Update current issue body
            if (!body.includes(blockedBodyLine)) {
              const nextBody = body.trim().length > 0 ? `${body}\n\n${blockedBodyLine}` : blockedBodyLine;
              await github.rest.issues.update({ owner, repo, issue_number: currentNumber, body: nextBody });
            }

            // Update blocker issue body
            const blockerBody = blockerIssue.body || '';
            if (!blockerBody.includes(blockingBodyLine)) {
              const nextBody = blockerBody.trim().length > 0 ? `${blockerBody}\n\n${blockingBodyLine}` : blockingBodyLine;
              await github.rest.issues.update({ owner, repo, issue_number: blockedBy, body: nextBody });
            }

            // Comment on current issue
            const currentComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: currentNumber, per_page: 100
            });
            if (!currentComments.some(c => (c.body || '').includes(`Blocked by #${blockedBy}`))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: currentNumber, body: blockedComment });
            }

            // Comment on blocker issue
            const blockerComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: blockedBy, per_page: 100
            });
            if (!blockerComments.some(c => (c.body || '').includes(`Blocks #${currentNumber}`))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: blockedBy, body: blockingComment });
            }

            console.log(`Relationship created: #${currentNumber} blocked by #${blockedBy}`);

      - name: Create issue branch
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;

            const slug = (issue.title || 'issue')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 40) || 'issue';

            const branchName = `issue/${issue.number}-${slug}`;

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;
            let baseBranch = 'Development';
            let baseSha;

            try {
              const developmentRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/Development' });
              baseSha = developmentRef.data.object.sha;
            } catch (e) {
              if (e.status === 404) {
                baseBranch = defaultBranch;
                const fallbackRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
                baseSha = fallbackRef.data.object.sha;
                console.log(`Branch Development not found, fallback to ${defaultBranch}`);
              } else {
                throw e;
              }
            }

            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha });
              console.log(`Created branch: ${branchName} from ${baseBranch}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Branch already exists: ${branchName}`);
              } else {
                throw e;
              }
            }
