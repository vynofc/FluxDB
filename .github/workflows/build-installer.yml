name: Build Installer

on:
  push:
    branches: [main]
    paths:
      - "Installer/**"
      - ".github/workflows/build-installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "Installer/**"
      - ".github/workflows/build-installer.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Installer
        run: |
          cd Installer
          go build -ldflags="-s -w" -o ../bin/FluxDB-Installer.exe .